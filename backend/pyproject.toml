[tool.poetry]
name = "testu-servilo"
version = "0.1.0"
description = "Backend for the Testu.eu website"
authors = ["Baptiste Darthenay <baptiste@darthenay.fr>"]
license = "AGPL-3.0"
package-mode = false

[tool.isort]
profile = "black"

[tool.ruff.lint]
ignore = ["E731"] # lambda/def

[tool.poetry.dependencies]
python = "~3.12"
dj-rest-auth = { extras = ["with-social"], version = "~7" }
django = "~5.1"
django-allauth = "^0.61.1"
django-anymail = { extras = ["sendgrid"], version = "~12" }
django-cors-headers = "^4.5.0"
django-extensions = "^3.2.3"
django-filter = "^24.3"
djangorestframework = "^3.15"
djangorestframework-simplejwt = { extras = ["crypto"], version = "^5.3.0" }
psycopg = { extras = ["binary"], version = "^3.2.3" }
python-decouple = "^3.8"
gunicorn = "~23"
whitenoise = "^6.8.2"

[tool.poetry.dev-dependencies]
black = "24.10.0"
django-stubs = "~5.1"
djhtml = "~3"
faker = "^33.0.0"
flake8 = "^7.1.1"
freezegun = "~1.5"
isort = "^5.10.1"
model-bakery = "~1"
pre-commit = "^4.0.1"
pycodestyle = "^2.12.1"
pyflakes = "^3.2.0"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
pytest-django = "^4.9.0"
pytest-factoryboy = "~2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
