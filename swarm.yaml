name: "testu"

services:
  django:
    image: batisteo/testu-www-django:latest
    working_dir: /src
    environment:
      - DJANGO_PORT
      - SECRET_KEY
      - DEBUG
    volumes:
      - backendassets:/src/assets:z
    networks:
      - main
    command: |
      sh -c "ls -lAh /src/ &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --capture-output --access-logfile -
      "

  postgres:
    image: postgres:14-alpine
    env_file:
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-ikso:/var/lib/postgresql/data
    networks:
      - main
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  main:
    driver: overlay

volumes:
  backendassets:
  postgres-ikso:
