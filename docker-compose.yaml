name: "testu"

services:
  django:
    build:
      context: backend
      target: development
    restart: on-failure
    volumes:
      - ./backend:/src:z
      - .assets:/src/assets:z
    working_dir: /src
    environment:
      DJANGO_PORT: "${DJANGO_PORT}"
    depends_on:
      - postgres
    env_file:
      - backend/.env
    networks:
      - web
      - internal
    tty: true
    ports:
      - 8092:8092
    stdin_open: true
    command: >
      sh -c "make migrate && make run"

  postgres:
    image: postgres:14-alpine
    restart: always
    env_file:
      - backend/.env
    volumes:
      - .docker/volumes/postgresql/data:/var/lib/postgresql/data:z
    networks:
      - internal

  vue:
    image: node:22-alpine
    volumes:
      - ./ui:/code:z
    working_dir: /code/
    user: 1000:1000
    networks:
      - web
      - internal
    tty: true
    ports:
      - 80:3000
      - 24678:24678
    tmpfs: /tmp  # https://github.com/nuxt/nuxt/issues/13587#issuecomment-1451481510
    command: >
      sh -c "npm install && npm run dev"

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
